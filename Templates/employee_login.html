{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
            <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
            <script src="https://kit.fontawesome.com/073f65d684.js" crossorigin="anonymous"></script>
            <link rel="stylesheet" href="{% static 'style.css' %}">    
      <style>
        .main-page 
        {
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            height:500px;
            width:350px;
            padding: 40px;
            border: 1px solid #333;
            border-radius: 4px;
            background-color: #fff;
            margin-top: 20px;
        }
                .button1
                {
                    padding:10px;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    width: 100%;
                }
                .btn-login
                {
                    height:40px;
                    width:100px;
                    border-radius:5px;
                    color:white;
                    background-color: #20a7db;
                    border: none;
                    margin-right: 10px;
                }
                .btn-reset
                {
                    height:40px;
                    width:100px;
                    border-radius:5px;
                    background-color: #333;
                    color:#fff;
                    border: 1px solid #333;
                    margin-left: 10px;
                }
                input
                {
                    font-size: 16px;
                    margin-bottom: 10px;
                    border-radius: 4px;
                    padding: 5px;
                    width: 100%;
                }
                .cred
                {
                    text-align:center;
                }
                .cred h1
                {
                    padding-top: 10px;
                    font-size: 22px;
                }
                .cred p
                {
                    font-size: 18px;
                
                }
                body
                {
                    background-color: #f5f5f5;
                    margin-bottom: 20px;
                    padding: 0;
                }
                .username
                {
                margin-top:5px;
                }
                label
                {
                    font-size: 18px;
                    margin-bottom: 5px;
                    display: block;
                }
      </style>
  </head>
  <body>
     <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color: #111936;">
        <a class="navbar-brand title text-white" href="{% url 'home' %}">ELECTROPLUM</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto mr-5">
                <li class="nav-item active">
                    <a class="nav-link text-white" href="{% url 'home' %}">Home <span class="sr-only">(current)</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" id="tag" href="{% url 'aboutus' %}">About Us</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" id="tag" href="{% url 'contactus' %}">Contact Us</a>
                </li>
                <li class="nav-item d-flex align-items-center">
                    <a class="nav-link text-white" id="tag" href="{% url 'employeeregistration' %}">Sign Up</a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <div class="row">
            <div class="col-12 d-flex flex-column justify-content-center align-items-center" style="min-height: calc(100vh - 56px);">
                <div class="main-page">
                        <div class = "cred">
                            <h1>Welcome Back</h1>
                            <p >Please enter your credentials to Login</p>
                        </div>
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }}">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}
                        <form method = "POST" action="{% url 'employee_login' %}" >
                        {% csrf_token %}
                        <div>
                            <label for="email">Email</label>
                            <input type="email"  name="email" class="email" id="email" placeholder="Enter Your email" required>
                            <div id = "emailError"></div>
                        </div>
                        <div>
                        <label for="password">password</label>
                        <input type="password" name="password" class="password" id="password" placeholder="Enter Your Password" required>
                        <div id = "passwordError">
                        </div>
                        </div>
                        <div class=" d-flex flex-row justify-content-center">
                            <button  class="btn btn-login">Login</button>
                            <button  class="btn btn-reset">Reset</button>
                        </div>
                        <a href="{% url 'employeeregistration' %}" class="btn btn-link" style="display: block; text-align: center; margin-top: 20px;">Don't have an account? Sign Up</a>
                       </form>
                    </div>
              </div>
        </div>
    </div>
  </body>
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
</html>
