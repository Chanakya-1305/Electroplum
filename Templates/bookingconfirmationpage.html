{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://kit.fontawesome.com/073f65d684.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'style.css' %}">     
  <style>
    body
    {
      font-family: 'Poppins', sans-serif;
      background-color: #f5f9ff;
    }
    .navbar 
    {
      background-color: #343a40;
    }
    .navbar-brand, .nav-link 
    {
      color: #fff !important;
    }
    .success-container 
    {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4rem 2rem;
      text-align: center;
    }
    .success-icon
    {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background-color: #d4edda;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
      animation: pop 0.5s ease-out;
    }
    .success-icon svg
    {
      width: 60px;
      height: 60px;
      stroke: #28a745;
    }
    @keyframes pop
    {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .footer 
    {
      padding: 1rem;
      background-color: #343a40;
      text-align: center;
      color: white;
      margin-top: 3rem;
    }
    .btn-home 
    {
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color: #111936;">
    <a class="navbar-brand title text-white" href="{% url 'home' %}" >ELECTROPLUM</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav ms-auto me-5">
      <li class="nav-item">
          <a class="nav-link text-white" id="tag" href="{% url 'logout' %}">Logout</a>
      </li>
      <li class="nav-item">
          <a class="nav-link text-white" id="tag" href="{% url 'bookinghistorypage' %}">Booking History</a>
      </li>
    </ul>
  </div>
</nav>
<body style="background:#f5f5f5;">
  <div class="container mt-5">
    <div class="card shadow p-5 text-center">
      <h2 class="text-success">✓ Booking Confirmed</h2><hr>
      <p class="lead">Your service booking has been submitted successfully.</p>
      <p>Our worker will contact you shortly.</p>
      <a href="{% url 'home' %}" class="btn btn-primary">Go to Home</a>
    </div>
  </div>
<!-- Footer -->
<footer class="footer">&copy; 2026 Electopum. All rights reserved.</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
