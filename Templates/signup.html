{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://kit.fontawesome.com/073f65d684.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'style.css' %}">    
      <style>
                .main-page 
                {
                    box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
                    height:700px;
                    width:350px;
                    padding: 40px;
                    border: 1px solid #333;
                    border-radius: 4px;
                    background-color: #fff;
                    margin-top: 20px;
                }
                .button1
                {
                    padding:10px;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    width: 100%;
                }
                .btn-login
                {
                    height:40px;
                    width:100px;
                    border-radius:5px;
                    color:white;
                    background-color: #20a7db;
                    border: none;
                    margin-right: 10px;
                }
                .btn-reset
                {
                    height:40px;
                    width:100px;
                    border-radius:5px;
                    background-color: #333;
                    color:#fff;
                    border: 1px solid #333;
                    margin-left: 10px;
                }
                input{
                    font-size: 16px;
                    margin-bottom: 10px;
                    border-radius: 4px;
                    padding: 5px;
                    width: 100%;
                }
                .cred
                {
                    text-align:center;
                }
                .cred h1
                {
                    padding-top: 10px;
                    font-size: 22px;
                }
                .cred p
                {
                    font-size: 18px;
                
                }
                body
                {
                    background-color: #f5f5f5;
                    margin-bottom: 20px;
                    padding: 0;
                }
                .username
                {
                margin-top:5px;
                }
                label
                {
                    font-size: 18px;
                    margin-bottom: 5px;
                    display: block;
                }
      </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color: #111936;">
        <a class="navbar-brand title text-white" href="{% url 'home' %}">ELECTROPLUM</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto mr-5">
                <li class="nav-item active">
                    <a class="nav-link text-white" href="{% url 'home' %}">Home <span class="sr-only">(current)</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" id="tag" href="{% url 'aboutus' %}">About Us</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" id="tag" href="{% url 'contactus' %}">Contact Us</a>
                </li>
                <li class="nav-item d-flex align-items-center">
                    <a class="nav-link text-white" id="tag" href="{% url 'newlogin' %}">Log In</a>
                </li>

            </ul>
        </div>
    </nav>
    
    <div class="container">
        <div class="row">
            <div class="col-12 d-flex flex-column justify-content-start align-items-center" style="min-height: calc(100vh - 40px); padding-top: 40px;">
                <div class="main-page">
                       <div class="signup-main-page">
                        <div class="cred">
                            <h1>Registration</h1>
                            <p>Create a new account</p>
                        </div>
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }}">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}


                        <form method="POST" action="{% url 'signup' %}">
                            {% csrf_token %}
                            <label>Name</label>
                            <input type="text" name="name" placeholder="Enter Name" required>

                            <label>Email</label>
                            <input type="email" name="email" placeholder="Enter Email" required>

                            <label>Password</label>
                            <input type="password" name="password" placeholder="Enter Password" required>

                            <label>Confirm Password</label>
                            <input type="password" name="confirm_password" placeholder="Re-enter Password" required>

                            <label>Mobile Number</label>
                            <input type="tel" name="mobile" placeholder="Enter Mobile Number" required>

                            <div class="d-flex flex-row justify-content-center">
                                <button type="submit" class="btn btn-login">Register</button>
                                <button type="reset" class="btn btn-reset">Reset</button>
                            </div>
                            <a href="{% url 'login' %}" class="btn btn-link" style="display: block; text-align: center; margin-top: 20px;">Already have an account? Login</a>
                        </form>
                    </div>
              </div>
        </div>
    </div>
  </body>

        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
</html>
