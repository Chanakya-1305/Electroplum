{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script src="https://kit.fontawesome.com/073f65d684.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
    <body class="page-with-sticky-navbar">
      <nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background-color: #111936;">
  <a class="navbar-brand title text-white" href="{% url 'home' %}" >ELECTROPLUM</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav ml-auto mr-5">
      <li class="nav-item active">
        <a class="nav-link text-white" href="{% url 'home' %}">Home <span class="sr-only">(current)</span></a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" id="tag" href="{% url 'aboutus' %}">About Us</a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" id="tag" href="#">Contact Us</a>
      </li>
      <li class="nav-item d-flex align-items-center">
            <a class="nav-link text-white" href="{% url 'logout' %}">logout</a>
          </li>
    </ul>
  </div>
</nav>
<div class =" theme-1 d-flex flex-row ">
  <img src="{% static 'plumber.webp' %}" alt="Banner Image" class="img-fluid" style=" height:150px;width: 150px; margin-right: 20px;">
    <p class = "par1">Our Best Plumbers</p>
</div>
{% for plumber in plumbers %}

<div class="theme-n d-flex flex-row">

    <img src="{{ plumber.photo.url }}"  alt="{{ plumber.name }}" class="img-fluid" style="height:170px; width:150px; margin-right:20px; border-radius:8px;">

    <div class = "d-flex flex-column justify-content-center">
        <p class="par2"><strong>Name : </strong> {{ plumber.name }}</p>
        <p class="par2"><strong>Experience : </strong>{{ plumber.experience }} Years</p>
        <p class="par2"><strong>Contact : </strong>{{ plumber.contact }}</p>
        <a class="btn-note" href="{% url 'booking' %}">Book Now</a>
    </div>
</div>
{% endfor %}
