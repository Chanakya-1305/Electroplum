{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://kit.fontawesome.com/073f65d684.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'style.css' %}">    
            <style>
                            body
                            {
                                background:#f5f5f5;
                            }
                            .booking-card
                            {
                                background:white;
                                padding:35px;
                                margin-top:40px;
                                margin-bottom:40px;
                                border-radius:10px;
                                box-shadow:0px 3px 12px rgba(0,0,0,0.15);
                            }
                            .booking-card h2
                            {
                                text-align:center;
                                font-weight:bold;
                            }
                            .booking-card p
                            {
                                text-align:center;
                                color:gray;
                                margin-bottom:30px;
                            }
                            label
                            {
                                font-weight:600;
                            }
                            .form-control
                            {
                                height:45px;
                            }
                            textarea
                            {
                                resize:none;
                            }
                            .btn-book
                            {
                                width:100%;
                                height:50px;
                                font-size:20px;
                                font-weight:bold;
                                border-radius:8px;
                            }

            </style>

</head>

<body>

            <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color: #111936;">
            <a class="navbar-brand text-white font-weight-bold" href="{% url 'home' %}"> ELECTROPLUM </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"> <span class="navbar-toggler-icon"></span> </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'home' %}">Home</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'aboutus' %}">About Us</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'contactus' %}">Contact Us</a>
                    </li>
                </ul>
            </div>
        </nav>
        <div class="container">
            <div class="booking-card">
                <h2>Book a Service</h2>
                <p>Fill in your details to book your service.</p>
                <form method="POST" action="{% url 'booking' %}">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6">
                        <label>Full Name</label>
                        <input type="text" class="form-control" name="customer_name" placeholder="Enter your name" required>
                        <br>
                        <label>Email</label>
                        <input type="email" class="form-control" name="email" placeholder="Enter your email" required>
                        <br>
                        <label>Phone Number</label>
                        <input type="tel" class="form-control" name="phone"  placeholder="Enter mobile number" maxlength="10" required>
                        <br>
                        <label>Service Address</label>
                        <textarea class="form-control" rows="5" name="address" placeholder="Enter complete address" required></textarea>
                    </div>
                    <div class="col-md-6">
                        <label>Service Category</label>
                        <select class="form-control" id="category" name="category" required>
                            <option value="">Select Service</option>
                            <option value="AC">AC Service</option>
                            <option value="PLUMBER">Plumber Service</option>
                            <option value="ELECTRICAL">Electrical Service</option>
                            <option value="INVERTER">Inverter Service</option>
                        </select>
                        <br>
                        <label>Worker Name</label>
                        <select class="form-control" id="worker" name="worker" required>
                            <option value="">Select Service Category First</option>
                        </select>
                        <br>
                        <label>Preferred Date</label>
                        <input type="date" class="form-control" name="booking_date" required>
                        <br>
                        <label>Preferred Time</label>
                        <input type="time" class="form-control" name="booking_time" required>
                        <br>
                        <label>Problem Description</label>
                        <textarea class="form-control" rows="3" name="problem" placeholder="Describe your problem" required></textarea>
                        <br>
                        <label>Payment Method</label>
                        <select class="form-control" name="payment_method" required>
                            <option value="">Select Payment Method</option>
                            <option>Cash After Service</option>
                            <option>UPI</option>
                            <option>Credit Card</option>
                            <option>Debit Card</option>
                            <option>Net Banking</option>
                        </select>
                    </div>
                </div>
                <div class="row mt-4">
                    <div class="col-md-12">
                        <button type="submit" class="btn btn-primary btn-book"> Confirm Booking </button>
                    </div>
                </div>
                </form>
            </div>
        </div>
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script>
const categorySelect = document.getElementById("category");
const workerSelect = document.getElementById("worker");
function loadWorkers() {
    const category = categorySelect.value;
    if (!category) {
        workerSelect.innerHTML = '<option value="">Select Service Category First</option>';
        return;
    }
    workerSelect.innerHTML = '<option value="">Loading workers...</option>';
    fetch("{% url 'get_workers' %}?category=" + encodeURIComponent(category))
    .then(response => response.json())
    .then(data => {
        workerSelect.innerHTML = '<option value="">Select Worker</option>';
        data.forEach(function(item) {
            workerSelect.innerHTML += `<option value="${item.id}">${item.name}</option>`;
        });
        if (data.length === 0) {
            workerSelect.innerHTML = '<option value="">No workers found for this service</option>';
        }
    })
    .catch(() => {
        workerSelect.innerHTML = '<option value="">Unable to load workers</option>';
    });
}
categorySelect.addEventListener("change", loadWorkers);
workerSelect.addEventListener("focus", function() {
    if (categorySelect.value && workerSelect.options.length <= 1) {
        loadWorkers();
    }
});
</script>
</body>
</html>
